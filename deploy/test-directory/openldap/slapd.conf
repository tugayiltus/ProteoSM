# Test directory for tools/directory-contract-test.sh. Fake data only (seed.ldif); never used outside the contract test.
include /etc/openldap/schema/core.schema
include /etc/openldap/schema/cosine.schema
include /etc/openldap/schema/inetorgperson.schema
include /etc/openldap/schema/ad-lite.schema

pidfile  /run/openldap/slapd.pid
argsfile /run/openldap/slapd.args

modulepath /usr/lib/openldap
moduleload back_mdb.so

# Certificates come from the test-ca service (gen-test-ca.sh). Clients are not asked for a certificate.
TLSCACertificateFile  /certs/ca.crt
TLSCertificateFile    /certs/server.crt
TLSCertificateKeyFile /certs/server.key
TLSVerifyClient       never

# Like Active Directory: passwords are only usable for a bind; signed-in accounts (the service account) may read entries.
access to attrs=userPassword
	by anonymous auth
	by * none
access to *
	by users read
	by * none

database  mdb
maxsize   104857600
suffix    "dc=proteone-test,dc=example"
rootdn    "cn=admin,dc=proteone-test,dc=example"
# Test-only root password for this throw-away container; the tests bind as the service account, never as root.
rootpw    test-only-root-pass
directory /var/lib/openldap/openldap-data

index objectClass                           eq
index sAMAccountName,userPrincipalName,mail eq
