<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser bar color before the app starts; applyColorMode then sets the chosen mode. Colors mirror THEME_COLORS. -->
    <meta name="theme-color" content="#f1f1f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Proteone</title>
    <script>
      // Applies the stored color mode before the first paint (no light flash in dark mode). Key mirrors COLOR_MODE_STORAGE_KEY.
      (function () {
        var mode = 'auto';
        try {
          var stored = localStorage.getItem('proteone-theme') || localStorage.getItem('tgysm-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'auto') mode = stored;
        } catch (e) {}
        if (mode === 'auto') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
